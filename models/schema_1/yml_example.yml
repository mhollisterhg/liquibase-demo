databaseChangeLog:
  - changeSet:
      id: yml_example_1
      author: mac
      labels: table:yml_example
      changes:
        - createTable:
            tableName: yml_example
            columns:
              - column:
                  name: c1
                  type: int
                  constraints:
                    primaryKey: true
              - column:
                  name: other
                  type: string

      rollback: |
        drop table yml_example

  - changeSet:
      id: yml_example_2
      author: mac
      labels: table:yml_example
      changes:
        - sql: |
            insert into yml_example (c1, other)
            values (1, "1")
      rollback:
        - sql: |
            delete from yml_example
            where c1 = 1
            and other = "1"
